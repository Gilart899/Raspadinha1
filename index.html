<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
        content="#0B7D2B">

    <meta name="description"
        content="Raspadinha da Amizade">

    <title>🍀 Raspadinha da Amizade</title>

    <!-- PWA -->

    <link rel="manifest"
        href="manifest.json">

    <link rel="icon"
        href="icons/favicon.png">

    <link rel="apple-touch-icon"
        href="icons/apple-touch-icon.png">

    <!-- CSS -->

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="css/animations.css">

</head>

<body>

<!-- =====================================================
     BACKGROUND
===================================================== -->

<div id="background">

    <div id="trevos"></div>

    <div id="particulas"></div>

    <div class="produto ferro"></div>

    <div class="produto liquidificador"></div>

</div>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <img
        src="img/logo.png"
        class="logo"
        alt="Logo">

    <h1>

        🍀 RASPADINHA DA AMIZADE

    </h1>

    <p>

        Raspe e concorra aos prêmios.

    </p>

</header>

<!-- =====================================================
     PRÊMIOS
===================================================== -->

<section class="premios">

    <article class="card">

        <img
            src="img/ferro.png"
            alt="Ferro Elétrico">

        <h2>

            Ferro Elétrico

        </h2>

    </article>

    <div class="ou">

        OU

    </div>

    <article class="card">

        <img
            src="img/liquidificador.png"
            alt="Liquidificador">

        <h2>

            Liquidificador

        </h2>

    </article>

</section>

<!-- =====================================================
     BOTÃO
===================================================== -->

<section class="acao">

    <button id="btnParticipar">

        🎁 RASPE E CONCORRA

    </button>

</section>

  <!-- =====================================================
     MODAL DA RASPADINHA
===================================================== -->

<div id="modal" class="hidden">

    <div class="janela">

        <h2>

            🍀 Boa sorte!

        </h2>

        <p>

            Raspe toda a área para descobrir o resultado.

        </p>

        <div id="raspadinha">

            <canvas id="canvas"></canvas>

            <div id="premio">

                <img
                    id="imagemPremio"
                    src=""
                    alt="Prêmio">

                <h1 id="textoPremio"></h1>

            </div>

        </div>

        <div class="botoes">

            <button id="compartilhar">

                Compartilhar

            </button>

            <button id="fechar">

                Fechar

            </button>

        </div>

    </div>

</div>

<!-- =====================================================
     MODAL DO GANHADOR
===================================================== -->

<div id="modalPremio" class="hidden">

    <div class="janela formulario">

        <img
            id="imgPremio"
            src=""
            alt="Prêmio">

        <h2 id="nomePremio">

            Parabéns!

        </h2>

        <p id="mensagemPremio">

            Você ganhou um prêmio! Preencha seus dados para receber.

        </p>

        <div class="campo">

            <label for="nome">

                Nome Completo

            </label>

            <input
                id="nome"
                type="text"
                autocomplete="name">

        </div>

        <div class="campo">

            <label for="cpf">

                CPF

            </label>

            <input
                id="cpf"
                type="text"
                maxlength="14"
                placeholder="000.000.000-00">

        </div>

        <div class="campo">

            <label for="telefone">

                Telefone

            </label>

            <input
                id="telefone"
                type="tel"
                placeholder="(00) 00000-0000"
                autocomplete="tel">

        </div>

        <div class="acoes">

            <button id="btnCancelar">

                Fechar

            </button>

            <button id="btnSalvar">

                🎁 Receber meu prêmio

            </button>

        </div>

    </div>

</div>

  <!-- =====================================================
     CONFETES
===================================================== -->

<div id="confetes"></div>

<!-- =====================================================
     LOADING
===================================================== -->

<div id="loading">

    <div class="spinner"></div>

    <p>

        Carregando...

    </p>

</div>

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module" src="js/firebase.js"></script>

<!-- =====================================================
     APLICAÇÃO
===================================================== -->

<script type="module" src="js/firebase-raspadinha.js"></script>

<script type="module" src="js/modal-premio.js"></script>

<script type="module" src="js/participantes.js"></script>

<script type="module" src="js/premios.js"></script>

<script type="module" src="js/sorteio.js"></script>

<script type="module" src="js/raspadinha.js"></script>

<script type="module" src="js/effects.js"></script>

<script type="module" src="js/sounds.js"></script>

<script type="module" src="js/utils.js"></script>

<script type="module" src="js/app.js"></script>

<!-- =====================================================
     SERVICE WORKER
===================================================== -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker

            .register("./sw.js")

            .then(() => {

                console.log("✅ Service Worker registrado.");

            })

            .catch((erro) => {

                console.error("Erro ao registrar Service Worker:", erro);

            });

    });

}

</script>

</body>

</html>
